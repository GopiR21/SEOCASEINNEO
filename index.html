<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Case S-9375</title>

    <link rel="icon"
          href="https://amicorpcapitalmanagement.es/wp-content/uploads/2025/09/favicon.jpg"
          type="image/jpeg">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            background: #f5f7fa;
            color: #1a1a2e;
        }

        #embed-container {
            width: 100%;
            min-height: 100vh;
        }

        #error-banner {
            display: none;
            margin: 1rem;
            padding: 1rem;
            background: #fde8e8;
            color: #9b1c1c;
            border-radius: 6px;
            border: 1px solid #f5c6c6;
        }

        #error-banner.visible {
            display: block;
        }
    </style>

    <!-- Pega Web Mashup JavaScript -->
    <script src="https://devportal.amicorp.com/prweb/PRRestService/c11nsvc/v1/pega-embed.js"></script>
</head>

<body>

    <div id="error-banner" role="alert" aria-live="polite"></div>

    <!-- Pega Case will be loaded here -->
    <div id="embed-container"></div>

    <script>
        (function () {
            "use strict";

            /*
             * Pega Web Mashup configuration
             */
            var PEGA_CONFIG = {
                action: "openCase",
                themeID: "ClientPortalCS",
                casePage: "full",
                appAlias: "CLMSCSDev",
                pegaServerUrl: "https://devportal.amicorp.com/prweb/",
                grantType: "none"
            };

            /*
             * Hard-coded Pega Case ID
             */
            var CASE_ID = "S-9375";


            /*
             * Simple logging function
             */
            function log(level, message, detail) {
                var prefix = "[AmicorpCaseBridge]";

                if (detail !== undefined) {
                    console[level](prefix, message, detail);
                } else {
                    console[level](prefix, message);
                }
            }


            /*
             * Display error message
             */
            function showError(message) {
                var banner = document.getElementById("error-banner");

                if (!banner) {
                    log("error", message);
                    return;
                }

                banner.textContent = message;
                banner.classList.add("visible");
            }


            /*
             * Create the Pega Embed
             */
            function createPegaEmbed(caseId) {

                var embed = document.createElement("pega-embed");

                /*
                 * Give the embed an ID
                 */
                embed.id = "theEmbed";

                /*
                 * Tell Pega that we want to open a Case
                 */
                embed.setAttribute(
                    "action",
                    PEGA_CONFIG.action
                );

                /*
                 * Pass the Case ID to Pega Embed
                 */
                embed.setAttribute(
                    "caseID",
                    caseId
                );

                /*
                 * Pass remaining Pega configuration
                 */
                embed.setAttribute(
                    "themeID",
                    PEGA_CONFIG.themeID
                );

                embed.setAttribute(
                    "casePage",
                    PEGA_CONFIG.casePage
                );

                embed.setAttribute(
                    "appAlias",
                    PEGA_CONFIG.appAlias
                );

                embed.setAttribute(
                    "pegaServerUrl",
                    PEGA_CONFIG.pegaServerUrl
                );

                embed.setAttribute(
                    "grantType",
                    PEGA_CONFIG.grantType
                );

                /*
                 * Make the embed occupy the full width
                 */
                embed.style.width = "100%";


                /*
                 * Handle Pega Embed errors
                 */
                embed.addEventListener("error", function (event) {

                    log(
                        "error",
                        "pega-embed reported an error.",
                        event
                    );

                    showError(
                        "Unable to open Case S-9375. Please check the Case ID or try again later."
                    );
                });


                return embed;
            }


            /*
             * Load the Pega Case
             */
            function loadPegaCase() {

                var embedContainer =
                    document.getElementById("embed-container");

                if (!embedContainer) {

                    throw new Error(
                        "Embed container #embed-container not found."
                    );
                }


                /*
                 * Create Pega Embed using S-9375
                 */
                var embed = createPegaEmbed(CASE_ID);


                /*
                 * Put Pega Embed inside the HTML page
                 */
                embedContainer.appendChild(embed);


                log(
                    "info",
                    "Pega Case embed created.",
                    {
                        action: PEGA_CONFIG.action,
                        caseID: CASE_ID
                    }
                );
            }


            /*
             * Start the Web Mashup
             */
            function init() {

                log(
                    "info",
                    "Initializing Pega Case Web Mashup."
                );

                try {

                    loadPegaCase();

                } catch (err) {

                    log(
                        "error",
                        "Initialization failed.",
                        err
                    );

                    showError(
                        "Something went wrong while starting the Pega Case."
                    );
                }
            }


            /*
             * Wait until the HTML page is loaded
             */
            if (document.readyState === "loading") {

                document.addEventListener(
                    "DOMContentLoaded",
                    init
                );

            } else {

                init();
            }

        })();
    </script>

</body>
</html>
