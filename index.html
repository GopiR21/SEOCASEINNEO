<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Case S-9375</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fa;
        }

        #embed-container {
            width: 100%;
            min-height: 100vh;
        }

        #error-banner {
            display: none;
            margin: 20px;
            padding: 15px;
            background: #fde8e8;
            color: #9b1c1c;
            border: 1px solid #f5c6c6;
            border-radius: 6px;
        }

        #error-banner.visible {
            display: block;
        }

        pega-embed {
            display: block;
            width: 100%;
        }
    </style>

    <!-- Pega Web Mashup JavaScript Library -->
    <script src="https://devportal.amicorp.com/prweb/PRRestService/c11nsvc/v1/pega-embed.js"></script>

</head>


<body>

    <!-- Error message -->
    <div id="error-banner" role="alert">
    </div>


    <!-- Pega Embed will be created and inserted here -->
    <div id="embed-container">
    </div>


    <script>

        (function () {

            "use strict";


            /*
             * =========================================================
             * Pega Web Mashup Configuration
             * =========================================================
             */

            var PEGA_CONFIG = {

                // Tell Pega that we want to open a Case
                action: "openCase",

                // Case that we want to open
                caseID: "S-9375",

                // Pega Theme
                themeID: "ClientPortalCS",

                // Display the complete Case page
                casePage: "full",

                // Pega Application
                appAlias: "CLMSCSDev",

                // Pega Server
                pegaServerUrl: "https://devportal.amicorp.com/prweb/",

                // Authentication configuration
                grantType: "customBearer",

                // Web Mashup client ID
                clientId: "22047533690484659444"
            };


            /*
             * =========================================================
             * Logging Function
             * =========================================================
             */

            function log(level, message, detail) {

                var prefix = "[PegaCaseMashup]";

                if (detail !== undefined) {

                    console[level](
                        prefix,
                        message,
                        detail
                    );

                } else {

                    console[level](
                        prefix,
                        message
                    );
                }
            }


            /*
             * =========================================================
             * Show Error
             * =========================================================
             */

            function showError(message) {

                var errorBanner =
                    document.getElementById("error-banner");


                if (!errorBanner) {

                    log("error", message);

                    return;
                }


                errorBanner.textContent = message;

                errorBanner.classList.add("visible");
            }


            /*
             * =========================================================
             * Create Pega Embed
             * =========================================================
             */

            function createPegaEmbed() {

                /*
                 * Create the <pega-embed> HTML element dynamically
                 */
                var embed =
                    document.createElement("pega-embed");


                /*
                 * Give the Pega Embed an ID
                 */
                embed.id = "theEmbed";


                /*
                 * -----------------------------------------------------
                 * Pass Pega Configuration to <pega-embed>
                 * -----------------------------------------------------
                 */

                embed.setAttribute(
                    "action",
                    PEGA_CONFIG.action
                );


                /*
                 * Pass Case ID
                 *
                 * S-9375
                 */
                embed.setAttribute(
                    "caseID",
                    PEGA_CONFIG.caseID
                );


                /*
                 * Pass Theme
                 */
                embed.setAttribute(
                    "themeID",
                    PEGA_CONFIG.themeID
                );


                /*
                 * Pass Case Page configuration
                 */
                embed.setAttribute(
                    "casePage",
                    PEGA_CONFIG.casePage
                );


                /*
                 * Pass Pega Application
                 */
                embed.setAttribute(
                    "appAlias",
                    PEGA_CONFIG.appAlias
                );


                /*
                 * Pass Pega Server URL
                 */
                embed.setAttribute(
                    "pegaServerUrl",
                    PEGA_CONFIG.pegaServerUrl
                );


                /*
                 * Pass authentication grant type
                 */
                embed.setAttribute(
                    "grantType",
                    PEGA_CONFIG.grantType
                );


                /*
                 * Pass Web Mashup client ID
                 */
                embed.setAttribute(
                    "clientId",
                    PEGA_CONFIG.clientId
                );


                /*
                 * Set width
                 */
                embed.style.width = "100%";


                /*
                 * -----------------------------------------------------
                 * Handle Pega Embed Error
                 * -----------------------------------------------------
                 */

                embed.addEventListener(
                    "error",
                    function (event) {

                        log(
                            "error",
                            "Pega Embed reported an error.",
                            event
                        );


                        showError(
                            "Unable to open Case S-9375. " +
                            "Please check the Case ID and access permissions."
                        );

                    }
                );


                /*
                 * Return the completed Pega Embed
                 */
                return embed;
            }


            /*
             * =========================================================
             * Load Pega Case
             * =========================================================
             */

            function loadPegaCase() {

                /*
                 * Find the HTML container
                 */
                var embedContainer =
                    document.getElementById(
                        "embed-container"
                    );


                /*
                 * Make sure the container exists
                 */
                if (!embedContainer) {

                    throw new Error(
                        "Embed container not found."
                    );
                }


                /*
                 * Create Pega Embed
                 */
                var embed =
                    createPegaEmbed();


                /*
                 * Add Pega Embed to the HTML page
                 */
                embedContainer.appendChild(
                    embed
                );


                /*
                 * Log information in browser console
                 */
                log(
                    "info",
                    "Pega Embed created successfully.",
                    {
                        action: PEGA_CONFIG.action,
                        caseID: PEGA_CONFIG.caseID,
                        appAlias: PEGA_CONFIG.appAlias,
                        pegaServerUrl: PEGA_CONFIG.pegaServerUrl
                    }
                );
            }


            /*
             * =========================================================
             * Initialize Web Mashup
             * =========================================================
             */

            function init() {

                log(
                    "info",
                    "Initializing Pega Case Web Mashup."
                );


                try {

                    /*
                     * Start loading Case S-9375
                     */
                    loadPegaCase();

                } catch (error) {

                    log(
                        "error",
                        "Pega Web Mashup initialization failed.",
                        error
                    );


                    showError(
                        "Something went wrong while loading " +
                        "Case S-9375."
                    );
                }
            }


            /*
             * =========================================================
             * Start JavaScript After HTML Is Loaded
             * =========================================================
             */

            if (
                document.readyState === "loading"
            ) {

                document.addEventListener(
                    "DOMContentLoaded",
                    init
                );

            } else {

                init();

            }

        })();

    </script>

</body>

</html>
